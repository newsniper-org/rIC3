[package]
name = "ric3-middleware"
version = "0.1.0"
edition = "2024"
authors = ["rIC3 fork contributors"]
description = "Middleware and caching layer for rIC3 hardware model checker"
license = "GPL-3.0"

[dependencies]
rIC3 = { path = "../..", package = "rIC3" }
logicrs = { path = "../../deps/logicrs" }
giputils = { path = "../../deps/giputils" }
portable-algebraic-aotjit = { git = "https://codeberg.org/newsniper-org/portable-algebraic-aotjit", rev = "eb9fb2935394c28a1100276002ab1a68601d9e18" }
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.11"
log = "0.4"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"

[[bin]]
name = "ric3-riemann"
path = "src/main.rs"
